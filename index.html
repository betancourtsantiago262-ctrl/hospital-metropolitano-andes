<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expediente Digital · Hospital Metropolitano de los Andes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545; --navy-2:#123863; --teal:#1B998B; --teal-2:#0E7C70;
  --paper:#F6F8F9; --card:#FFFFFF; --ink:#152238; --sub:#5B6B7C;
  --line:#DCE3E8; --amber:#C9820A; --red:#B3311E;
  --radius:10px;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1620; --card:#141F2B; --ink:#E7EDF2; --sub:#93A4B5; --line:#26333F;
}}
:root[data-theme="dark"]{ --paper:#0E1620; --card:#141F2B; --ink:#E7EDF2; --sub:#93A4B5; --line:#26333F; }
*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top,0px);}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;line-height:1.5;}
h1,h2,h3,.serif{font-family:'Zilla Slab',Georgia,serif;}
a{color:var(--teal-2);}

.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;
  padding:14px 20px calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;}
.topbar .mark{width:34px;height:34px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Zilla Slab',serif;flex-shrink:0;}
.topbar .name{font-family:'Zilla Slab',serif;font-weight:600;font-size:1.05rem;}
.topbar .tag{font-size:.78rem;color:#BFD3E6;}
.topbar .badge{margin-left:auto;font-size:.7rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  padding:5px 10px;border-radius:20px;white-space:nowrap;}

.shell{display:flex;max-width:1280px;margin:0 auto;min-height:100vh;}
nav.side{width:270px;flex-shrink:0;padding:22px 14px 40px;border-right:1px solid var(--line);position:sticky;
  top:64px;align-self:flex-start;max-height:calc(100vh - 64px);overflow-y:auto;}
nav.side .grp{margin-bottom:6px;}
nav.side .grp-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);
  padding:14px 10px 6px;font-weight:600;}
nav.side button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);
  font:inherit;font-size:.88rem;padding:8px 10px;border-radius:8px;cursor:pointer;border-left:3px solid transparent;}
nav.side button:hover{background:var(--card);}
nav.side button.active{background:var(--card);border-left-color:var(--teal);color:var(--teal-2);font-weight:600;}

main{flex:1;padding:28px 32px 70px;min-width:0;}
.doc{display:none;max-width:840px;}
.doc.active{display:block;}
.letterhead{border-bottom:3px solid var(--teal);padding-bottom:14px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.letterhead h1{font-size:1.5rem;margin:0 0 4px;color:var(--navy-2);}
.letterhead .meta{color:var(--sub);font-size:.85rem;}
.letterhead .stamp{font-size:.7rem;border:1px solid var(--teal);color:var(--teal-2);padding:5px 10px;border-radius:6px;white-space:nowrap;}
.doc p.lead{color:var(--sub);margin-top:-8px;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
.card h3{margin:0 0 10px;font-size:1.02rem;color:var(--navy-2);}
table{width:100%;border-collapse:collapse;font-size:.87rem;}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
th{background:var(--paper);color:var(--sub);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;}
.tbl-wrap{overflow-x:auto;}
ul.pl{margin:6px 0;padding-left:20px;}
ul.pl li{margin-bottom:4px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}
.pill{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:20px;background:rgba(27,153,139,.12);color:var(--teal-2);font-weight:600;}
.pill.warn{background:rgba(201,130,10,.12);color:var(--amber);}
.pill.crit{background:rgba(179,49,30,.12);color:var(--red);}
.sig{margin-top:18px;display:flex;gap:40px;color:var(--sub);font-size:.85rem;flex-wrap:wrap;}
.sig div{border-top:1px solid var(--line);padding-top:6px;min-width:180px;}
.bars{display:flex;gap:16px;align-items:flex-end;height:150px;border-bottom:1px solid var(--line);padding:0 6px 4px;}
.bars .bar{flex:1;text-align:center;font-size:.7rem;color:var(--sub);}
.bars .bar i{display:block;background:linear-gradient(180deg,var(--teal),var(--teal-2));border-radius:4px 4px 0 0;margin:0 auto 6px;}
.foot{margin-top:26px;font-size:.75rem;color:var(--sub);text-align:right;}
.mob-nav{display:none;}

/* ---- topbar controls ---- */
.tb-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;font:inherit;
  font-size:.78rem;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.tb-btn:hover{background:rgba(255,255,255,.22);}

/* ---- search ---- */
.search-wrap{padding:2px 4px 12px;}
.search-wrap input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);font:inherit;font-size:.85rem;}
.search-wrap input:focus{outline:2px solid var(--teal);outline-offset:1px;}
nav.side .grp.hide,nav.side button.hide{display:none;}

/* ---- hero (Inicio) ---- */
.hero{position:relative;border-radius:14px;padding:32px 30px;margin-bottom:20px;overflow:hidden;
  background:radial-gradient(1200px 340px at 100% -10%,rgba(27,153,139,.35),transparent),linear-gradient(135deg,var(--navy),var(--navy-2));
  color:#fff;}
.hero h1{font-size:1.9rem;margin:0 0 8px;color:#fff;}
.hero p{max-width:60ch;color:#CFE1EE;margin:0 0 6px;}
.hero .who{margin-top:14px;font-size:.85rem;color:#9FD8CD;}
.ekg{position:absolute;bottom:0;left:0;width:100%;height:52px;opacity:.55;}
.ekg path{fill:none;stroke:#4FD3BE;stroke-width:2;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.2s ease-out forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:22px 0;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;}
.kpi b{display:block;font-family:'Zilla Slab',serif;font-size:1.7rem;color:var(--teal-2);line-height:1;}
.kpi span{font-size:.76rem;color:var(--sub);}
.ring-wrap{display:flex;align-items:center;gap:16px;}
.ring{transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:9;}
.ring .bg{stroke:var(--line);}
.ring .fg{stroke:var(--teal);stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;animation:ring 1.6s .3s ease-out forwards;}
@keyframes ring{to{stroke-dashoffset:16;}}
.reveal{animation:up .55s ease both;}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.quicknav{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.qn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);}
.qn:hover{border-color:var(--teal);}
.qn b{display:block;font-size:.92rem;margin-bottom:3px;}
.qn small{color:var(--sub);font-size:.78rem;}

@media print{
  .topbar,nav.side,.sig~.foot,.no-print{display:none!important;}
  main{padding:0;}
  .doc{display:none;}
  .doc.active{display:block!important;}
  body{background:#fff;}
}
@media(max-width:860px){
  .shell{flex-direction:column;}
  nav.side{position:static;width:100%;max-height:none;border-right:none;border-bottom:1px solid var(--line);}
  main{padding:22px 16px 60px;}
}
</style>
</head>

</div>

{group:"Seguridad del paciente", id:"protocolos", title:"Protocolos de seguridad del paciente", meta:"Gestión de Calidad · Versión 4 · 2026", body:`
<p class="lead">Protocolos vigentes que rigen la actividad quirúrgica y de bioseguridad del servicio.</p>
<div class="card"><h3>Higiene de manos</h3><ul class="pl"><li>Aplicación de los 5 momentos OMS en todo contacto con el paciente y el campo estéril.</li>
<li>Lavado quirúrgico con antiséptico de amplio espectro, técnica en 5 tiempos, duración 3–5 minutos antes del primer procedimiento del día.</li>
<li>Fricción alcohólica entre procedimientos cuando las manos no están visiblemente sucias.</li></ul></div>
<div class="card"><h3>Pausa quirúrgica (Lista de Chequeo de Cirugía Segura)</h3><ul class="pl">
<li><strong>Sign In</strong> (antes de anestesia): identificación del paciente, sitio quirúrgico marcado, consentimientos firmados, riesgo de vía aérea y sangrado revisado.</li>
<li><strong>Time Out</strong> (antes de incisión): confirmación verbal de equipo, procedimiento, sitio y lateralidad; profilaxis antibiótica administrada; disponibilidad de imágenes.</li>
<li><strong>Sign Out</strong> (antes de salir de sala): conteo de gasas e instrumental completo, rotulado de muestras, revisión de incidentes con el equipo.</li></ul></div>
<div class="card"><h3>Manejo de procedimientos contaminados</h3><ul class="pl">
<li>Clasificación de la cirugía como limpia, limpia-contaminada, contaminada o sucia desde la programación.</li>
<li>Circuito diferenciado de circulación de personal, material e instrumental para casos contaminados, evitando cruce con flujo limpio.</li>
<li>Doble empaque y rotulado de alerta biológica para instrumental utilizado; transporte inmediato en contenedor cerrado a la Central de Reprocesamiento.</li></ul></div>
<div class="card"><h3>Ingreso del paciente a salas de cirugía</h3><ul class="pl">
<li>Verificación de identificación con brazalete, historia clínica y consentimientos informados completos.</li>
<li>Confirmación de ayuno, retiro de prótesis y objetos metálicos, y verificación de la lista prequirúrgica.</li>
<li>Traslado en camilla exclusiva del área quirúrgica; cambio de vestimenta según barrera de la zona restringida.</li></ul></div>
<div class="card"><h3>Manejo de residuos</h3><ul class="pl">
<li>Clasificación según Decreto 780 de 2016: biosanitarios (bolsa roja), cortopunzantes (guardián), ordinarios (bolsa negra) y anatomopatológicos (contenedor específico).</li>
<li>Recolección interna mínimo cada turno; ruta sanitaria diferenciada de la ruta de insumos limpios.</li>
<li>Registro de pesaje y entrega a gestor externo autorizado, con manifiesto de disposición final.</li></ul></div>
`},

{group:"Central de Reprocesamiento", id:"trazabilidad", title:"Sistema de trazabilidad de instrumental", meta:"Central de Reprocesamiento · Software SteriTrack HMA", body:`
<p class="lead">La Central de Reprocesamiento identifica cada set y cada instrumento mediante código de barras vinculado a un registro digital, garantizando trazabilidad completa desde la recepción hasta el uso en el paciente.</p>
<div class="card"><h3>Ciclo de vida registrado</h3><ul class="pl">
<li><strong>Recepción en sucio:</strong> escaneo del set, verificación contra guía fotográfica y conteo de piezas.</li>
<li><strong>Lavado y descontaminación:</strong> registro de lavadora termodesinfectadora, lote y operario.</li>
<li><strong>Empaque y esterilización:</strong> autoclave, número de ciclo, temperatura, tiempo, indicador químico y biológico asociado.</li>
<li><strong>Almacenamiento estéril y distribución:</strong> ubicación, fecha de vencimiento del empaque, servicio y sala de destino.</li>
<li><strong>Uso y devolución:</strong> paciente y procedimiento (cuando aplica), hora de devolución a la Central.</li></ul></div>
<div class="card"><h3>Qué permite el sistema</h3><ul class="pl">
<li>Retiro inmediato de un lote completo ante un control biológico positivo (trazabilidad hacia atrás).</li>
<li>Identificación de responsables en cada etapa del proceso.</li>
<li>Reportes de indicadores de oportunidad y devolución incompleta de sets.</li></ul>
<p style="margin:10px 0 0;color:var(--sub);font-size:.85rem">Área de oportunidad identificada: registros de devolución diligenciados manualmente en algunos turnos de alta demanda; se adelanta migración a lectura RFID en fase piloto.</p></div>
`},
{group:"Central de Reprocesamiento", id:"controles", title:"Registros de controles de esterilización", meta:"3 autoclaves de vapor · 1 equipo de peróxido de hidrógeno", body:`
<div class="card"><div class="tbl-wrap"><table><tr><th>Tipo de control</th><th>Frecuencia</th><th>Equipo</th><th>Último resultado</th></tr>
<tr><td>Control físico (temperatura, presión, tiempo)</td><td>Cada ciclo</td><td>Autoclave 1, 2, 3</td><td>Conforme</td></tr>
<tr><td>Control químico interno y externo</td><td>Cada paquete</td><td>Todos</td><td>Conforme</td></tr>
<tr><td>Control biológico (esporas)</td><td>Semanal (diario en cargas con implantes)</td><td>Autoclave 1, 2, 3</td><td>Negativo</td></tr>
<tr><td>Control biológico equipo de peróxido de hidrógeno</td><td>Cada carga</td><td>Equipo baja temperatura</td><td>Negativo</td></tr>
<tr><td>Prueba Bowie-Dick</td><td>Diaria, primer ciclo del día</td><td>Autoclave 1, 2, 3</td><td>Conforme</td></tr>
</table></div><p style="margin:10px 0 0;color:var(--sub);font-size:.85rem">Hallazgo en seguimiento: durante auditoría interna se identificaron registros de control biológico no diligenciados con oportunidad en dos jornadas de alta demanda; no se evidenció liberación de material sin control. Acción correctiva en curso.</p></div>
`},
{group:"Central de Reprocesamiento", id:"instrumental", title:"Protocolo de entrega, recepción y lavado de instrumental", meta:"Circuito sucio → limpio → estéril", body:`
<div class="card"><ul class="pl">
<li><strong>Entrega desde sala:</strong> el instrumentador cuenta el set contra la guía quirúrgica, lo cubre con campo húmedo y lo traslada en contenedor cerrado.</li>
<li><strong>Recepción en sucio:</strong> verificación de piezas, registro de procedencia (sala, procedimiento, clasificación de riesgo biológico).</li>
<li><strong>Prelavado enzimático:</strong> inmersión inmediata para evitar secado de materia orgánica.</li>
<li><strong>Lavado manual y ultrasónico:</strong> cepillado de articulaciones y lúmenes, verificación visual de restos.</li>
<li><strong>Lavadora termodesinfectadora:</strong> ciclo validado con registro de lote y temperatura de desinfección.</li>
<li><strong>Secado e inspección funcional:</strong> revisión bajo lupa de filos, articulaciones y ausencia de residuos.</li>
<li><strong>Armado y empaque:</strong> según guía fotográfica del set, con indicador químico interno y sellado con indicador externo.</li>
<li><strong>Esterilización y liberación:</strong> verificación de parámetros del ciclo antes de habilitar el set para distribución.</li>
<li><strong>Entrega en estéril:</strong> confirmación de indicador viraje y firma de recibido en sala.</li></ul></div>
`},

function filterNav(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('nav.side .grp').forEach(g=>{
    let any=false;
    g.querySelectorAll('button').forEach(b=>{
      const m = b.textContent.toLowerCase().includes(q);
      b.classList.toggle('hide', !m);
      if(m) any=true;
    });
    g.classList.toggle('hide', !any && q.length>0);
  });
}
function toggleTheme(){
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme')==='dark';
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = dark ? '🌙 Modo oscuro' : '☀️ Modo claro';
  try{ localStorage.setItem('hma-theme', dark?'light':'dark'); }catch(e){}
}
try{
  const saved = localStorage.getItem('hma-theme');
  if(saved){ document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').textContent = saved==='dark' ? '☀️ Modo claro' : '🌙 Modo oscuro'; }
}catch(e){}
function show(id){
  document.querySelectorAll('.doc').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('nav.side button').forEach(b=>b.classList.remove('active'));
  document.getElementById('doc-'+id).classList.add('active');
  document.querySelector(`nav.side button[data-id="${id}"]`).classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
}
show(DOCS[0].id);
</script>
